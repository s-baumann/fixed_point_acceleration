[package]
name = "fixed_point_acceleration"
version = "0.1.0"
edition = "2024"

[dependencies]
# The core array library
ndarray = "0.15"

# The linear algebra library (needed for Anderson acceleration)
# We enable the "netlib" feature to give it a backend solver
ndarray-linalg = { version = "0.16", features = ["netlib-system"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"